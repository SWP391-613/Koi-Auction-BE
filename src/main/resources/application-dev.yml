server:
  port: ${PORT:8080}

api:
  prefix: /api/v1

spring:
  application:
    name: Koi-BE
  output:
    ansi:
      enabled: ALWAYS
  messages:
    basename: i18n/messages
    encoding: UTF-8

  datasource:
    url: jdbc:postgresql://zimacube.tail21fc44.ts.net:5432/koi_company
    username: ${POSTGRES_USER:casaos}
    password: ${POSTGRES_PASSWORD:casaos}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test}
    password: ${MAIL_PASSWORD:test}

  security:
    oauth2:
      client:
        registration:
          google:
            clientId: ${GOOGLE_OAUTH2_CLIENT_ID:test}
            clientSecret: ${GOOGLE_OAUTH2_CLIENT_SECRET:test}

  data:
    redis:
      #spring.data.redis.use-redis-cache
      use-redis-cache: false
      host: ${REDIS_HOST:localhost} # Default to 'localhost' if not provided
      port: ${REDIS_PORT:6379}      # Default to 6379 if not provided

  graphql:
    graphiql:
      enabled: true
      path: ${api.prefix}/graphiql
    path: ${api.prefix}/graphql
    schema:
      printer:
        enabled: true
    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: "*"

alert:
  manager:
    emails: ${ALERT_MANAGER_EMAILS:hoangclw@gmail.com}

jwt:
  expiration: ${JWT_EXPIRATION:1800}
  expiration-refresh-token: ${JWT_EXPIRATION_REFRESH_TOKEN:86400}
  secretKey: ${JWT_SECRET_KEY:TaqlmGv1iEDMRiFp/pHuID1+T84IABfuA0xXh4GhiUI=}

logging:
  level:
    org.springframework: DEBUG
    springframework.security: DEBUG
    org.hibernate: DEBUG
  file:
    path: ${LOG_PATH:logs}
    name: ${LOG_PATH:logs}/application.log

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

#health check
management:
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true

# 3rd party
unsplash:
  api:
    root: ${UNSPLASH_ROOT:test}
    client-id: ${UNSPLASH_CLIENT_ID:test}

vnpay:
  api:
    vnp_Version: ${VNPAY_VERSION:test}
    vnp_Command: ${VNPAY_COMMAND:test}
    vnp_OrderType: ${VNPAY_ORDER_TYPE:test}
    vnp_PayUrl: ${VNPAY_PAY_URL:test}
    vnp_Returnurl: ${VNPAY_RETURN_URL:test}
    vnp_TmnCode: ${VNPAY_TMN_CODE:test}
    vnp_HashSecret: ${VNPAY_HASH_SECRET:test}
    vnp_apiUrl: ${VNPAY_API_URL:test}
